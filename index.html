<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet Odası</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { text-align: center; color: #ff5722; margin-top: 0; }
        #messages-container { flex: 1; background: #1e1e1e; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .message-item { background: #2a2a2a; padding: 10px; border-radius: 6px; word-break: break-word; }
        .input-area { display: flex; gap: 10px; }
        #message-input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; outline: none; }
        #send-btn { padding: 0 20px; background: #ff5722; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #send-btn:hover { background: #e64a19; }
    </style>
</head>
<body>

    <h2>Sohbet Odası</h2>
    <div id="messages-container"></div>
    
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Mesajınızı yazın...">
        <button id="send-btn">Gönder</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyBLGudgl1THqUEAqqo6GkjjRozWT_dL4",
            authDomain: "sohbet-odasi-9722b.firebaseapp.com",
            databaseURL: "https://sohbet-odasi-9722b-default-rtdb.firebaseio.com",
            projectId: "sohbet-odasi-9722b",
            storageBucket: "sohbet-odasi-9722b.firebasestorage.app",
            messagingSenderId: "347482470481",
            appId: "1:347482470481:web:7bfe14198f95d4cadaa070",
            measurementId: "G-YQ0YD1SKHG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let username = prompt("Lütfen kullanıcı adınızı girin:") || "Misafir";

        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-btn");
        const messagesContainer = document.getElementById("messages-container");

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            push(ref(db, 'messages'), {
                username: username,
                text: text,
                timestamp: Date.now()
            });

            messageInput.value = "";
        }

        sendButton.addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        onChildAdded(ref(db, 'messages'), (snapshot) => {
            const data = snapshot.val();
            const messageDiv = document.createElement("div");
            messageDiv.className = "message-item";
            messageDiv.innerHTML = `<strong>${data.username}:</strong> ${data.text}`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
